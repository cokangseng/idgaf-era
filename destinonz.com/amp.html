            :root {

                filter: blur(25px);
                opacity: 0.7;
                animation: beamMove 7s infinite alternate ease-in-out;
            }

            .beam-left { left: -15%; transform-origin: top; }
            .beam-right { right: -15%; transform-origin: top; animation-delay: -3.5s; }

            .dust {

                width: 100%;
